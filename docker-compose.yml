services:
  postgis:
    image: postgis/postgis:18-master
    container_name: postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: geo
    ports: 
      - "5433:5432"
    volumes: 
      - postgis_data:/var/lib/postgresql

volumes:
  postgis_data:

